<meta property="og:url" content="https://falercia.github.io/hassle-free-management/">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17181A; --paper:#F6F4EF; --paper2:#EDEAE0; --paper3:#E4E0D5;
  --diag:#C8451B; --steel:#3E5266; --rule:#B9B3A5; --muted:#6E6A60;
  --on-ink:#F6F4EF; --on-ink-muted:rgba(246,244,239,.64); --on-ink-rule:rgba(246,244,239,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --serif:'IBM Plex Serif',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --wrap:1200px; --gut:clamp(16px,4vw,48px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:3px}
.ink :focus-visible,.viewer :focus-visible{outline-color:var(--on-ink)}
#vShell:focus{outline:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:.04em}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:24px;height:60px}
.brand{font-family:var(--sans);font-weight:600;font-size:17px;text-decoration:none;white-space:nowrap}
.brand span{font-weight:400;color:var(--muted)}
.top nav{margin-left:auto;display:flex;align-items:center;gap:24px;font-family:var(--sans);font-size:15px}
.top nav a{text-decoration:none;color:var(--muted)}
.top nav a:hover{color:var(--ink)}
.lang{display:flex;gap:2px;font-family:var(--mono);font-size:13px}
.lang button{padding:6px 8px;color:var(--muted);border-bottom:2px solid transparent}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.viewer .lang button{color:var(--on-ink-muted)}
.viewer .lang button[aria-pressed="true"]{color:var(--on-ink);border-bottom-color:var(--on-ink)}

/* hero */
.ink{background:var(--ink);color:var(--on-ink)}
.hero{padding:clamp(56px,9vw,120px) 0 clamp(56px,8vw,104px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0 clamp(40px,6vw,96px);align-items:start}
.hero-top{grid-column:1/-1}
.series{color:var(--on-ink-muted);margin:0 0 20px}
.tick{width:64px;height:4px;background:var(--diag);margin:0 0 40px}
.hero h1{font-family:var(--sans);font-weight:700;font-size:clamp(42px,5.4vw,76px);line-height:1.02;letter-spacing:-.025em;margin:0 0 28px;max-width:12ch}
.hero .lede{font-size:clamp(18px,1.6vw,21px);line-height:1.6;color:rgba(246,244,239,.86);margin:0 0 40px;max-width:36em}
.cta{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 24px;background:var(--on-ink);color:var(--ink);font-family:var(--sans);font-weight:600;font-size:16px;text-decoration:none}
.cta:hover{background:#fff}
.how{border-top:1px solid var(--on-ink-rule);margin-top:10px}
.how h2{font-family:var(--sans);font-weight:600;font-size:15px;margin:16px 0 4px;color:var(--on-ink-muted)}
.how ol{list-style:none;margin:0;padding:0}
.how li{display:grid;grid-template-columns:40px 1fr;gap:0 8px;padding:20px 0;border-bottom:1px solid var(--on-ink-rule)}
.how li .mono{color:var(--on-ink-muted);padding-top:3px}
.how strong{display:block;font-family:var(--sans);font-weight:600;font-size:19px;line-height:1.3;margin-bottom:4px}
.how p{margin:0;font-size:16px;line-height:1.55;color:rgba(246,244,239,.74)}

/* sections */
section{scroll-margin-top:60px}
.sec{padding:clamp(64px,8vw,112px) 0}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 64px;align-items:end;margin-bottom:40px}
.sec h2{font-family:var(--sans);font-weight:600;font-size:clamp(30px,3.6vw,46px);line-height:1.08;letter-spacing:-.015em;margin:0}
.sec-head p{margin:0;color:var(--muted);max-width:34em}

/* anatomy */
.anatomy{background:var(--paper2)}
.pages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:32px 20px}
.pages button{display:block;width:100%;text-align:left}
.pages img{width:100%;height:auto;aspect-ratio:4/5;border:1px solid var(--rule);background:var(--paper)}
.pages button:hover img{border-color:var(--ink)}
.pages .lbl{display:flex;gap:10px;align-items:baseline;margin-top:12px;font-family:var(--sans);font-size:15px;font-weight:500;line-height:1.3}
.pages .lbl .mono{color:var(--muted);font-weight:400}
.pages small{display:block;margin-top:4px;font-size:14px;line-height:1.45;color:var(--muted)}
.example{margin:28px 0 0;font-size:15px;color:var(--muted)}

/* index */
.tools{display:grid;gap:20px;margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.search{position:relative;max-width:560px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:52px;padding:0 16px 0 44px;font-family:var(--sans);font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:0;-webkit-appearance:none}
.search input:focus{outline:2px solid var(--steel);outline-offset:0;border-color:var(--steel)}
.filters{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0;padding:0;list-style:none}
.filters button{font-family:var(--sans);font-size:15px;padding:8px 0;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--diag)}
.filters .mono{font-size:12px;margin-left:6px}
.count{color:var(--muted);margin:0}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:48px 24px}
.card{display:block;text-decoration:none}
.card img{width:100%;height:auto;aspect-ratio:4/5;background:var(--ink)}
.card .meta{display:flex;gap:10px;align-items:baseline;margin-top:14px}
.card .mono{color:var(--muted)}
.card h3{font-family:var(--sans);font-weight:600;font-size:18px;line-height:1.25;margin:0}
.card:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.card .ter{display:block;margin-top:4px;font-size:14px;line-height:1.4;color:var(--muted)}
.empty{padding:48px 0;max-width:36em}
.empty p{margin:0 0 20px}
.link-btn{font-family:var(--sans);font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:3px}

/* footer */
footer{background:var(--paper2);border-top:1px solid var(--rule);padding:56px 0 64px;font-size:16px}
footer .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px 64px}
footer p{margin:0 0 12px;max-width:40em}
footer ul{list-style:none;margin:0;padding:0;font-family:var(--sans);font-size:15px}
footer li{padding:10px 0;border-bottom:1px solid var(--rule)}
footer li:first-child{border-top:1px solid var(--rule)}
footer a{text-underline-offset:3px}
.fine{color:var(--muted);font-size:14px}

/* viewer */
.viewer{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--ink);color:var(--on-ink);overflow:hidden}
.viewer::backdrop{background:var(--ink)}
.v-shell{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.v-bar{display:flex;align-items:center;gap:16px;height:60px;padding:0 var(--gut);border-bottom:1px solid var(--on-ink-rule)}
.v-bar .ttl{font-family:var(--sans);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.v-bar .ttl .mono{color:var(--on-ink-muted);font-weight:400;margin-right:10px}
.v-bar .lang{margin-left:auto}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--on-ink-rule);flex:none}
.icon-btn:hover{border-color:var(--on-ink)}
.icon-btn:disabled{opacity:.3;cursor:default}
.v-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;padding:24px var(--gut) 20px}
.frame{position:relative;display:flex;align-items:center;justify-content:center;gap:20px;min-height:0;touch-action:pan-y}
.frame img{max-height:100%;max-width:100%;width:auto;height:auto;aspect-ratio:4/5;object-fit:contain;background:#222326;user-select:none;-webkit-user-drag:none}
.progress{display:flex;align-items:center;gap:16px;padding-top:20px;max-width:640px;width:100%;margin:0 auto}
.segs{display:flex;gap:4px;flex:1}
.segs button{flex:1;height:20px;position:relative}
.segs button::after{content:"";position:absolute;left:0;right:0;top:9px;height:3px;background:var(--on-ink-rule)}
.segs button.past::after{background:rgba(246,244,239,.5)}
.segs button[aria-current="true"]::after{background:var(--diag)}
.progress .mono{color:var(--on-ink-muted);min-width:44px;text-align:right}
.p-arrow{display:none}
.panel{border-left:1px solid var(--on-ink-rule);padding:32px 32px 40px;overflow-y:auto}
.panel .ter{color:var(--on-ink-muted);margin:0 0 12px}
.panel h2{font-family:var(--sans);font-weight:600;font-size:30px;line-height:1.12;letter-spacing:-.01em;margin:0 0 24px}
.panel .hook{font-size:21px;line-height:1.45;margin:0 0 28px;padding-left:16px;border-left:2px solid var(--on-ink)}
.panel h3{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--on-ink-muted);margin:0 0 6px}
.panel .about{font-size:16px;line-height:1.6;color:rgba(246,244,239,.82);margin:0 0 32px}
.actions{display:grid;gap:10px;margin-bottom:32px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 20px;font-family:var(--sans);font-weight:600;font-size:16px;text-decoration:none;border:1px solid var(--on-ink-rule)}
.btn.primary{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink)}
.btn.primary:hover{background:#fff}
.btn:not(.primary):hover{border-color:var(--on-ink)}
.nav-topics{display:grid;gap:0;border-top:1px solid var(--on-ink-rule)}
.nav-topics button{display:block;text-align:left;padding:14px 0;border-bottom:1px solid var(--on-ink-rule)}
.nav-topics button:hover .t{text-decoration:underline;text-underline-offset:3px}
.nav-topics small{display:block;font-family:var(--sans);font-size:13px;color:var(--on-ink-muted)}
.nav-topics .t{font-family:var(--sans);font-weight:500;font-size:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--on-ink);color:var(--ink);font-family:var(--sans);font-size:15px;padding:12px 18px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:1100px){
  .pages{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
  .pages li{scroll-snap-align:start}
}
@media (max-width:960px){
  .hero .wrap,.sec-head,footer .wrap{grid-template-columns:1fr}
  .top nav a{display:none}
  .viewer{overflow-y:auto}
  .v-shell{height:auto;min-height:100%}
  .v-body{grid-template-columns:1fr}
  .stage{padding:16px var(--gut) 8px}
  .frame img{max-height:calc(100dvh - 150px)}
  .frame .icon-btn{display:none}
  .p-arrow{display:inline-grid}
  .progress{padding-top:12px;gap:12px}
  .progress .mono{min-width:0}
  .panel{border-left:0;border-top:1px solid var(--on-ink-rule);padding:28px var(--gut) 48px;overflow:visible}
}
@media (max-width:640px){
  .pages{grid-template-columns:repeat(10,62%);gap:20px 16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 16px}
  .filters{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(var(--gut) * -1);padding:0 var(--gut);scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .card h3{font-size:16px}
  .brand span{display:none}
  .v-bar .ttl .mono{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}
</style>
</head>

<script>
(function(){
const POSTS = window.POSTS || [], TER = window.TERRITORIES || {};
const FEATURED = '01';
const T = {
  pt:{
    htmlLang:'pt-BR', title:'Isso Tem Nome · Gestão Sem Complicação',
    brand:'Isso Tem Nome <span>Gestão Sem Complicação</span>',
    navHow:'Como funciona', navTopics:'Os temas',
    series:'Isso Tem Nome · Gestão Sem Complicação',
    h1:'Se o problema se repete, ele tem nome.',
    lede:'São {n} situações que todo gestor enfrenta, da 1:1 que não muda nada à reunião cheia de gente que não precisava estar ali. Cada uma virou um carrossel de dez páginas com o erro comum, a régua para reconhecer, o método e o que fazer a partir de amanhã.',

const $ = s => document.querySelector(s);
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] != null ? o[k] : '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let lang = (new URLSearchParams(location.search).get('lang') || store.get('itn-lang') || (navigator.language || 'pt')).slice(0,2).toLowerCase() === 'en' ? 'en' : 'pt';
let ter = 0, query = '';
const L = () => lang === 'en' ? 1 : 0;
const t = () => T[lang];
const N = POSTS.length;
const byN = Object.fromEntries(POSTS.map((p, i) => [p.n, i]));
const pdfUrl = p => 'posts/' + encodeURIComponent(p.dir) + '/' + encodeURIComponent(p.pdf[L()]);
const slideUrl = (p, i) => 'posts/' + encodeURIComponent(p.dir) + '/' + (lang === 'en' ? 'slides-en' : 'slides') + '/slide-' + String(i).padStart(2, '0') + '.png';
const terName = n => (TER[n] || TER[String(n)] || ['',''])[L()];
POSTS.forEach(p => { p._s = norm([p.n, p.title.join(' '), p.hook.join(' '), p.about.join(' '), (TER[p.territory]||[]).join(' ')].join(' ')); });

function applyText(){
  const d = t();
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = d[el.dataset.t]; if (v == null) return;
    const s = fmt(v, {n: N});
    if (/<[a-z]/i.test(s)) el.innerHTML = s; else el.textContent = s;
  });
  $('#q').placeholder = d.searchPh;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}

function renderPages(){
  const p = POSTS[byN[FEATURED]]; if (!p) return;
  $('#pages').innerHTML = t().pages.map((pg, i) => {
    const k = String(i + 1).padStart(2, '0');
    return '<li><button type="button" data-page="' + (i + 1) + '">' +
      '<img src="site/anatomy/' + lang + '-' + k + '.jpg" alt="" loading="lazy" width="360" height="450">' +
      '<span class="lbl"><span class="mono">' + k + '</span>' + esc(pg[0]) + '</span><small>' + esc(pg[1]) + '</small></button></li>';
  }).join('');
  $('[data-t="anaExample"]').textContent = fmt(t().anaExample, {t: p.title[L()]});
}

function renderFilters(){
  const counts = {}; POSTS.forEach(p => counts[p.territory] = (counts[p.territory] || 0) + 1);
  const items = [[0, t().all, N]].concat(Object.keys(TER).map(k => [Number(k), terName(k), counts[k] || 0]));
  $('#filters').innerHTML = items.map(([k, name, c]) =>
    '<li><button type="button" data-ter="' + k + '" aria-pressed="' + (k === ter) + '">' + esc(name) + '<span class="mono">' + c + '</span></button></li>').join('');
}

function renderGrid(){
  const q = norm(query.trim());
  const list = POSTS.filter(p => (!ter || p.territory === ter) && (!q || q.split(/\s+/).every(w => p._s.includes(w))));
  $('#grid').innerHTML = list.map(p =>
    '<li><a class="card" href="#' + p.n + '">' +
    '<img src="site/thumbs/' + p.n + '-' + lang + '.jpg" alt="" loading="lazy" decoding="async" width="600" height="750">' +
    '<span class="meta"><span class="mono">' + p.n + '</span><h3>' + esc(p.title[L()]) + '</h3></span>' +
    '<span class="ter">' + esc(terName(p.territory)) + '</span></a></li>').join('');
  $('#count').textContent = list.length === 1 ? t().count1 : fmt(t().countN, {n: list.length});
  $('#empty').hidden = list.length > 0;
  $('#emptyMsg').textContent = fmt(t().empty, {q: query.trim()});
}

function setLang(l){
  if (l === lang) return;
  lang = l; store.set('itn-lang', l);
  const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u);
  applyText(); renderPages(); renderFilters(); renderGrid();
  if (cur >= 0) show();
}

/* viewer */
const dlg = $('#viewer'), img = $('#vImg');
let cur = -1, page = 1;

function hashFor(){ return '#' + POSTS[cur].n + (page > 1 ? '-' + page : ''); }
function open(i, pg){
  cur = i; page = Math.min(10, Math.max(1, pg || 1));
  if (!dlg.open){ dlg.showModal(); document.body.classList.add('locked'); $('#vShell').focus({preventScroll:true}); }
  show();
}
function close(){
  if (dlg.open) dlg.close();
}
dlg.addEventListener('close', () => {
  document.body.classList.remove('locked');
  if (/^#\d/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  const last = cur; cur = -1;
  const a = document.querySelector('.card[href="#' + (POSTS[last] || {}).n + '"]'); if (a) a.focus({preventScroll:false});
});

function show(){
  const p = POSTS[cur], d = t();
  img.src = slideUrl(p, page);
  img.alt = fmt(d.pageAlt, {p: page, t: p.title[L()]});
  $('#vBarTitle').innerHTML = '<span class="mono">' + p.n + '</span>' + esc(p.title[L()]);
  $('#vTer').textContent = terName(p.territory);
  $('#vTitle').textContent = p.title[L()];
  $('#vHook').textContent = p.hook[L()];
  $('#vAbout').textContent = p.about[L()].charAt(0).toUpperCase() + p.about[L()].slice(1);
  const pdf = $('#vPdf'); pdf.href = pdfUrl(p); pdf.setAttribute('download', p.pdf[L()]);
  $('#vCount').textContent = String(page).padStart(2, '0') + '/10';
  $('#segs').innerHTML = Array.from({length: 10}, (_, k) =>
    '<button type="button" data-go="' + (k + 1) + '" class="' + (k + 1 < page ? 'past' : '') + '"' + (k + 1 === page ? ' aria-current="true"' : '') + ' aria-label="' + esc(fmt(d.goPage, {n: k + 1})) + '"></button>').join('');
  $('#vPrev').disabled = page === 1; $('#vNext').disabled = page === 10;
  document.querySelectorAll('.p-arrow').forEach(b => b.disabled = (b.dataset.step === '-1' ? page === 1 : page === 10));
  const prev = POSTS[(cur - 1 + N) % N], next = POSTS[(cur + 1) % N];
  $('#vPrevTopic .t').textContent = prev.n + '  ' + prev.title[L()];
  $('#vNextTopic .t').textContent = next.n + '  ' + next.title[L()];
  history.replaceState(null, '', location.pathname + location.search + hashFor());
  [page + 1, page - 1].filter(k => k >= 1 && k <= 10).forEach(k => { const im = new Image(); im.src = slideUrl(p, k); });
}
function go(k){ if (cur < 0) return; const n = Math.min(10, Math.max(1, k)); if (n !== page){ page = n; show(); } }
function topic(delta){ open((cur + delta + N) % N, 1); dlg.querySelector('.panel').scrollTop = 0; }

$('#vPrev').onclick = () => go(page - 1);
document.querySelectorAll('.p-arrow').forEach(b => b.onclick = () => go(page + Number(b.dataset.step)));
$('#vNext').onclick = () => go(page + 1);
$('#vClose').onclick = close;
$('#vPrevTopic').onclick = () => topic(-1);
$('#vNextTopic').onclick = () => topic(1);
$('#segs').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go)); });
$('#vCopy').onclick = async () => {
  const url = location.href;
  try { await navigator.clipboard.writeText(url); toast(t().copied); } catch (e) { window.prompt(t().copy, url); }
};
dlg.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); go(page + 1); }
  if (e.key === 'ArrowLeft'){ e.preventDefault(); go(page - 1); }
});
let sx = null, sy = null, swiped = false;
const frame = $('#frame');
frame.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; swiped = false; });
frame.addEventListener('pointerup', e => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ swiped = true; go(page + (dx < 0 ? 1 : -1)); }
});
img.addEventListener('click', e => {
  if (swiped){ swiped = false; return; }
  const r = img.getBoundingClientRect(); go(page + (e.clientX - r.left > r.width / 2 ? 1 : -1));
});

let tt;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1800); }

/* routing */
function route(){
  const m = location.hash.match(/^#(\d{2})(?:-(\d{1,2}))?$/);
  if (m && byN[m[1]] != null) open(byN[m[1]], Number(m[2]) || 1);
  else if (dlg.open && !location.hash) close();
}
window.addEventListener('hashchange', route);

/* events */
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('#filters').addEventListener('click', e => { const b = e.target.closest('[data-ter]'); if (!b) return; ter = Number(b.dataset.ter); renderFilters(); renderGrid(); });
$('#q').addEventListener('input', e => { query = e.target.value; renderGrid(); });
$('#clear').onclick = () => { query = ''; $('#q').value = ''; ter = 0; renderFilters(); renderGrid(); $('#q').focus(); };
$('#pages').addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (!b) return; const k = Number(b.dataset.page); location.hash = FEATURED + (k > 1 ? '-' + k : ''); });

applyText(); renderPages(); renderFilters(); renderGrid(); route();
})();
</script>
</body>
